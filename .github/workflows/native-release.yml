# SPDX-License-Identifier: GPL-3.0-or-later
# Do not publish SFS0 as a boot volume before V2 namespace, actual
# production BOOT validator and OVMF kernel/initramfs tests pass.
name: Qualify SFS V2 hosted-only DEB and native RUN
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential binutils cmake git pkg-config libssl-dev libsqlite3-dev dpkg-dev
      - name: Qualify portable V2 package
        run: |
          set -euo pipefail
          python3 standalone/release.py release
          python3 standalone/check-package.py dist/*.deb --profile portable
          test "$(find dist -maxdepth 1 -name '*.deb' | wc -l)" = 1
          test "$(find dist -maxdepth 1 -name '*.run' | wc -l)" = 1
          test "$(find dist -maxdepth 1 -name '*.ko' | wc -l)" = 0
          mkdir -p "$RUNNER_TEMP/portable"
          dpkg-deb -x dist/*.deb "$RUNNER_TEMP/portable"
          test "$(find "$RUNNER_TEMP/portable" -type f | wc -l)" = 2
          bash tests/check_v2_exports.sh "$RUNNER_TEMP/portable/System/Filesystems/SFS.so"
      - name: Qualify native source-embedded RUN
        run: |
          set -euo pipefail
          installer="$(find dist -maxdepth 1 -name '*.run' -print -quit)"
          bash "$installer" --profile aggressive --build-only --output "$RUNNER_TEMP/native"
          deb="$(find "$RUNNER_TEMP/native" -maxdepth 1 -name '*.deb' -print -quit)"
          test -s "$deb"
          python3 standalone/check-package.py "$deb" --profile aggressive
          mkdir -p "$RUNNER_TEMP/root"
          dpkg-deb -x "$deb" "$RUNNER_TEMP/root"
          test "$(find "$RUNNER_TEMP/root" -type f | wc -l)" = 2
          bash tests/check_v2_exports.sh "$RUNNER_TEMP/root/System/Filesystems/SFS.so"
          test "$(find "$RUNNER_TEMP/root" -name '*.ko' | wc -l)" = 0
      - uses: actions/upload-artifact@v4
        with:
          name: SFS-hosted-v2-qualification-only
          path: dist/*
          if-no-files-found: error
  publish:
    needs: qualify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SFS-hosted-v2-qualification-only
          path: dist
      - name: Publish immutable qualified hosted V2 packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          tag="v$version"
          test "$(find dist -maxdepth 1 -type f -name '*.deb' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name '*.run' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name '*.ko' | wc -l)" -eq 0
          if gh release view "$tag" --json tagName >/dev/null 2>&1; then
            echo "Existing immutable release $tag preserved"
            exit 0
          fi
          gh release create "$tag" dist/*.deb dist/*.run --target "$GITHUB_SHA" \
            --title "SFS hosted Common V2 filesystem release $version" \
            --notes "SFS Common V2-only hosted filesystem module and manual; old public V1 and filesystem-specific kernel-module assets are excluded. This is NOT a fully qualified BOOT release."

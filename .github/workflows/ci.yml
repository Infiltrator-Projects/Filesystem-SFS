# SPDX-License-Identifier: GPL-3.0-or-later
name: Qualify Common V2 SFS0 native core and hosted module
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sfs0:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile source-owned Common V2 root/bitmap parser and tests
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
      - name: Assert installed production ABI and no kernel fallback
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          DESTDIR="$stage" cmake --install build
          test "$(find "$stage" -type f | wc -l)" = 2
          cmp build/SFS.so "$stage/System/Filesystems/SFS.so"
          bash tests/check_v2_exports.sh "$stage/System/Filesystems/SFS.so"
          test -s "$stage/System/Resources/Documentation/Filesystem-SFS.pdf"
          test "$(find "$stage" -name '*.ko' | wc -l)" = 0
      - uses: actions/upload-artifact@v4
        with:
          name: SFS0-hosted-v2-not-BOOT-qualified
          path: build/SFS.so
